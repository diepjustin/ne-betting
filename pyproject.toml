[project]
name = "husker-markets"
version = "0.1.0"
description = "Collection and analysis pipeline for prediction-market activity on Nebraska football"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
